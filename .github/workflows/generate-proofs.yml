name: Generate CCFU Proofs Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode generator script
        run: echo '$(cat /tmp/generate-ccfu-proofs.b64)' | base64 -d > generate-ccfu-proofs.js

      - name: Generate CCFU Proofs pages
        run: node generate-ccfu-proofs.js .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ccfu_proofs/
          git diff --cached --quiet || git commit -m "Auto-generate CCFU Proofs pages"
          git push
