name: Generate CCFU Simulator Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode generator script
        run: echo '' | base64 -d > generate-simulator-pages.js

      - name: Generate Simulator pages
        run: node generate-simulator-pages.js .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ccfu_simulators/
          git diff --cached --quiet || git commit -m "Auto-generate CCFU simulator pages"
          git push
