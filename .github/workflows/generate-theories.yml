name: Generate Theory Pages (v2 - Static HTML)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode generator script
        run: echo "" | base64 -d > generate-theories.js

      - name: Generate theory pages
        run: node generate-theories.js .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add theories/ sitemap.xml
          git diff --cached --quiet || git commit -m "Auto-generate theory pages (v2 static HTML)"
          git push
