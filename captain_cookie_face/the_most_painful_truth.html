<script>
(async () => {

  const entry = {
    id: "2511113654809",
    safecreative_url: "https://www.safecreative.org/work/2511113654809-the-most-painful-truth",
    title: "The most painful truth",
    date: "11/11/2025",
    text: "The most painful truth is to understand you were wrong.",
    nft_url: "https://og.rarible.com/token/polygon/0x35f8aee672cde8e5fd09c93d2bfe4ff5a9cf0756:35217764257041821129612382974364344714071826739048644696460290739576330256386",
    tweet_url: ""
  };

  const canonicalString = [
    entry.id,
    entry.safecreative_url,
    entry.title,
    entry.date,
    entry.text,
    entry.nft_url,
    entry.tweet_url
  ].join('\n---\n');

  const data = new TextEncoder().encode(canonicalString);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashHex = [...new Uint8Array(hashBuffer)]
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');

  document.getElementById('hashResult').textContent = hashHex;

  const container = document.getElementById('rendered');

  for (const [key, value] of Object.entries(entry)) {
    const div = document.createElement('div');
    div.className = 'block';

    const label = document.createElement('div');
    label.className = 'key';
    label.textContent = key;
    div.appendChild(label);

    if (key.endsWith('_url') && value) {
      const a = document.createElement('a');
      a.href = value;
      a.textContent = value;
      a.target = '_blank';
      div.appendChild(a);
    } else {
      const pre = document.createElement('pre');
      pre.textContent = value;
      div.appendChild(pre);
    }

    container.appendChild(div);
  }

  document.getElementById('copyHashBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(hashHex);
    alert('Hash copied');
  });

})();
</script>
