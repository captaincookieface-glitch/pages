<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Captain Cookie Face Universe Archives</title>
  <meta name="description" content="Captain Cookie Face Universe Archives — theories, simulators, axioms, and structured thought artifacts.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family:
        Arial,
        "Helvetica Neue",
        Helvetica,
        system-ui,
        sans-serif;
      background: #ffffff;
      color: #000;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
    }

    header {
      padding: 60px 20px 40px;
    }

    header img {
      max-width: 320px;
      width: 80%;
      height: auto;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2rem;
      font-weight: normal;
      margin: 0;
    }

    main {
      padding: 40px 20px 0;
    }

    .universe-logo {
      border-radius: 50%;
    }

    .slider-wrapper {
      width: 100%;
      margin: 40px auto 0;
      overflow: hidden;
      position: relative;
      touch-action: pan-y;
    }

    .slider-track {
      display: flex;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    .slider-track.dragging {
      transition: none;
    }

    .slide {
      min-width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 3%;
      flex-wrap: nowrap;
      padding: 20px 4%;
    }

    .card {
      width: 28%;
      max-width: 180px;
      border: 1px solid #eee;
      padding: 15px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .card:active {
      transform: scale(0.97);
    }

    .card img {
      width: 100%;
      height: auto;
      margin-bottom: 12px;
      border: 1px solid #eee;
      border-radius: 50%;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: bold;
    }

    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 24px;
      padding-bottom: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d4d4d4;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }

    .dot.active {
      background: #666;
      transform: scale(1.3);
    }

    footer {
      padding: 40px 20px;
      font-size: 0.9rem;
      color: #777;
    }

    @media (min-width: 640px) {
      .card-title {
        font-size: 1.1rem;
      }
      .card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<header>
  <img class="universe-logo" src="./assets/images/AFB9C382-3B34-4925-B318-E7083E758055.png" alt="Captain Cookie Face Universe">
  <h1>Welcome to Captain Cookie Face Universe Archives</h1>
</header>

<main>

  <div class="slider-wrapper" id="slider">
    <div class="slider-track" id="track">

      <div class="slide">
        <a class="card" href="/theories/">
          <img src="./assets/images/0DB0891F-5BB7-4D51-BF28-F67AF05197CE.png" alt="Theories">
          <div class="card-title">Theories</div>
        </a>
        <a class="card" href="/captain_cookie_face/">
          <img src="./assets/images/EEC475CE-9849-4816-ABC5-7BB5525C6D28.png" alt="Captain Cookie Face">
          <div class="card-title">Captain Cookie Face</div>
        </a>
        <a class="card" href="/ccfu_simulators/">
          <img src="./assets/images/71663728-97C2-4B27-9214-62CE3EF2847A.png" alt="CCFU Simulators">
          <div class="card-title">CCFU Simulators</div>
        </a>
      </div>

      <div class="slide">
        <a class="card" href="/ccfu_proofs/">
          <img src="./assets/images/proofs-1024.svg" alt="CCFU Proofs">
          <div class="card-title">CCFU Proofs</div>
        </a>
      </div>

    </div>
  </div>

  <div class="dots" id="dots">
    <button class="dot active" data-i="0" aria-label="Slide 1"></button>
    <button class="dot" data-i="1" aria-label="Slide 2"></button>
  </div>

</main>

<footer>
  &copy;2026 Captain Cookie Face Universe
</footer>

<script>
(function() {
  var track = document.getElementById('track');
  var slider = document.getElementById('slider');
  var dots = document.querySelectorAll('.dot');
  var total = 2;
  var current = 0;
  var startX = 0, deltaX = 0, isDragging = false;

  function goTo(i) {
    current = Math.max(0, Math.min(total - 1, i));
    track.style.transform = 'translateX(-' + (current * 100) + '%)';
    dots.forEach(function(d, idx) {
      d.classList.toggle('active', idx === current);
    });
  }

  dots.forEach(function(d) {
    d.addEventListener('click', function() { goTo(+d.dataset.i); });
  });

  slider.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
    isDragging = true;
    track.classList.add('dragging');
  }, { passive: true });

  slider.addEventListener('touchmove', function(e) {
    if (!isDragging) return;
    deltaX = e.touches[0].clientX - startX;
    var offset = -current * slider.offsetWidth + deltaX;
    track.style.transform = 'translateX(' + offset + 'px)';
  }, { passive: true });

  slider.addEventListener('touchend', function() {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    if (deltaX < -50) goTo(current + 1);
    else if (deltaX > 50) goTo(current - 1);
    else goTo(current);
    deltaX = 0;
  });

  slider.addEventListener('mousedown', function(e) {
    e.preventDefault();
    startX = e.clientX;
    isDragging = true;
    track.classList.add('dragging');
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    deltaX = e.clientX - startX;
    var offset = -current * slider.offsetWidth + deltaX;
    track.style.transform = 'translateX(' + offset + 'px)';
  });

  document.addEventListener('mouseup', function() {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    if (deltaX < -50) goTo(current + 1);
    else if (deltaX > 50) goTo(current - 1);
    else goTo(current);
    deltaX = 0;
  });

  slider.addEventListener('click', function(e) {
    if (Math.abs(deltaX) > 10) e.preventDefault();
  }, true);
})();
</script>

</body>
</html>
