name: Download ICESat-2 ATL03

on:
  workflow_dispatch:  # manual trigger from GitHub UI
  # push:
  #   branches: [main]  # uncomment to run on push

jobs:
  download-atl03:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install earthaccess h5py pandas numpy

      - name: Download & process ATL03
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python download_atl03.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: atl03-data
          path: atl03_output/
          retention-days: 30
