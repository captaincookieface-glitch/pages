name: Generate CCFU Scripts Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode generator script
        run: echo '' | base64 -d > generate-ccfu-scripts.js

      - name: Generate CCFU Scripts pages
        run: node generate-ccfu-scripts.js .

      - name: Ensure canonical URL
        run: node .github/ensure-canonical.js scripts/index.html https://www.captaincookieface.com/scripts/
  
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/
          git diff --cached --quiet || git commit -m "Auto-generate CCFU Scripts pages"
          git push
