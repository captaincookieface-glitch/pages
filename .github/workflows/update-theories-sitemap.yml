name: Update Sitemap – Theories Only

on:
  push:
    paths:
      - 'theories/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract theory URLs and update sitemap
        run: |
          set -euo pipefail

          INDEX_FILE="theories/index.html"
          SITEMAP_FILE="sitemap.xml"
          BASE_URL="https://www.captaincookieface.com/theories"

          if [ ! -f "$INDEX_FILE" ]; then
            echo "ERROR: $INDEX_FILE not found"
            exit 1
          fi

          if [ ! -f "$SITEMAP_FILE" ]; then
            echo "ERROR: $SITEMAP_FILE not found"
            exit 1
          fi

          # ── 1. Extract theory hrefs from index.html ──
          # Matches href="./something.html" patterns inside theory list items
          THEORY_FILES=$(grep -oP 'href="\./\K[^"]+\.html' "$INDEX_FILE" | sort -u)

          if [ -z "$THEORY_FILES" ]; then
            echo "ERROR: No theory HTML files found in $INDEX_FILE"
            exit 1
          fi

          echo "Found theories:"
          echo "$THEORY_FILES"

          # ── 2. Build new theory URL blocks ──
          THEORY_URLS=""
          while IFS= read -r file; do
            THEORY_URLS+="<url><loc>${BASE_URL}/${file}</loc></url>"$'\n'
          done <<< "$THEORY_FILES"

          # Also include the theories index page itself
          THEORY_INDEX_ENTRY="<url><loc>${BASE_URL}/</loc></url>"$'\n'
          THEORY_INDEX_ENTRY+="<url><loc>${BASE_URL}/index.html</loc></url>"$'\n'

          # ── 3. Remove existing theory entries from sitemap ──
          # Keep only lines that do NOT contain /theories/
          NON_THEORY_LINES=$(grep -v "captaincookieface.com/theories/" "$SITEMAP_FILE" || true)

          # ── 4. Rebuild sitemap: non-theory lines + new theory block ──
          # Extract everything before </urlset>
          HEADER=$(echo "$NON_THEORY_LINES" | sed '/<\/urlset>/d')

          cat > "$SITEMAP_FILE" << SITEMAP_EOF
          ${HEADER}
          ${THEORY_INDEX_ENTRY}${THEORY_URLS}</urlset>
          SITEMAP_EOF

          # ── 5. Clean up: remove leading whitespace caused by heredoc indentation ──
          sed -i 's/^[[:space:]]*//' "$SITEMAP_FILE"

          # Remove empty lines
          sed -i '/^$/d' "$SITEMAP_FILE"

          echo ""
          echo "Updated sitemap.xml:"
          cat "$SITEMAP_FILE"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet "$SITEMAP_FILE" && echo "No changes to sitemap.xml" && exit 0
          git add sitemap.xml
          git commit -m "Auto-update sitemap.xml – theories section synced from theories/index.html"
          git push
        env:
          SITEMAP_FILE: sitemap.xml
